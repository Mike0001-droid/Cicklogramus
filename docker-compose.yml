  backend:
    build: .
    container_name: cicklogram_backend
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8080
      "
    # volumes:
    #   - ./backend:/app
    env_file:
      - .env
    # depends_on:
    #   db:
    #     condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.standalone.conf
    container_name: cicklogram_frontend
    ports:
      - "$FRONTEND_PORT:80"
    restart: unless-stopped
    depends_on:
      - backend
